<!doctype html><meta charset="utf-8"><title>sending</title><body style="background:#111;color:#fff;font:16px sans-serif">Sending thumbnail...
<script>
(async () => {
  const i = new URLSearchParams(location.search).get("i") || "1";
  const r = await fetch("t" + i + ".jpg", { cache: "no-store" });
  const bytes = new Uint8Array(await r.arrayBuffer());
  let bin = "";
  for (let k = 0; k < bytes.length; k += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(k, k + 0x8000));
  const b64 = btoa(bin);
  location.replace("https://create.roblox.com/dashboard/creations/experiences/10770930201/places/130709333532142/thumbnails#fyp" + i + "=" + b64);
})();
</script>
