<h1 class="lijn">Drugs Realiteit Quiz</h1>

<label id="label" for="naam">Vul je naam in:</label>
<input type="text" id="naam">
<span id="foutmelding"></span>

<div id="hidden">
<button id="start" type="button">Start quiz</button>

<h3 id="naamin"></h3>

  <form id="form">
  <div class="question-section">
    <div class="vraag">
      <img src="../../assets/Des/alchol.png" alt="Sport en fitness afbeelding">
      <p id="quiz"></p>
    </div>

    <div id="fieldset" class="antwoorden">
      <div class="ab">
      <input class="radio" id="A" type="radio" name="antwoord" value="1">
      <label class="antwoord-button" for="A"></label>
      <br>
      <input class="radio" id="B" type="radio" name="antwoord" value="2">
      <label class="antwoord-button" for="B"></label>
      </div>
      <br>
      <div class="cd">
      <input class="radio" id="C" type="radio" name="antwoord" value="3">
      <label class="antwoord-button" for="C"></label>
      <br>
      <input class="radio" id="D" type="radio" name="antwoord" value="4">
      <label class="antwoord-button" for="D"></label>
    </div>
    </div>

    <input type="text" id="openvraag">
    <div id="loader1"></div>
    <div id="goud"><img src="../../assets/goud.png" width="200px" ></div>
    <div id="zilver"><img src="../../assets/zilver.png" width="200px" ></div>
    <div id="brons"><img src="../../assets/brons.png" width="200px" ></div>
    <div id="knopterug"><a href="../../home.html">Terug naar Home</a></div>
    <p id="resultaat"></p>
    </div>
    <div class="footer">
      <button class="nav-button" id="knop" type="submit">Antwoord</button>
